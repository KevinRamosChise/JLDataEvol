<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#C41E3A">
    <title>Iniciar Sesión | JL DATA PRO</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css?v=1.1">
    <link rel="stylesheet" href="assets/css/dashboard.css?v=1.0">
</head>
<body class="login-page">
    <div class="login-box">
        <img src="assets/images/logo.png?v=2" alt="JL DATA PRO" class="login-box__logo" width="80" height="80">
        <h1>Panel de Administración</h1>
        <p>Ingresa con tu cuenta de Firebase Auth</p>

        <div class="login-error" id="login-error"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" class="form-input" placeholder="admin@jldatapro.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn--primary btn--lg btn--full" id="login-btn">
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <a href="index.html" class="login-back">← Volver al sitio</a>
    </div>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
